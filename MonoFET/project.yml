name: MonoFET
options:
  bundleIdPrefix: com.example
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "11.0"
    CODE_SIGN_IDENTITY: "-"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
targets:
  MonoFET:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: MonoFETExtension
    info:
      path: App/Info.plist
      properties:
        CFBundleName: MonoFET
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MonoFET
  MonoFETExtension:
    type: app-extension
    platform: macOS
    sources: [Source]
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudioKit.framework
    info:
      path: Source/Info.plist
      properties:
        CFBundleName: MonoFETExtension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit
          NSExtensionPrincipalClass: MonoFETFactory
          NSExtensionAttributes:
            AudioComponents:
              - name: "Cleber: MonoFET"
                description: Mono com ramo duplicado invertido e compressor VCA, saida mono
                manufacturer: Cldr
                subtype: mfet
                type: aufx
                version: 1
                sandboxSafe: true
                tags: [Effects]
    entitlements:
      path: Source/Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MonoFET.AU
